<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <meta name="description" content="Xem menu của nhà hàng">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="korean-text">안녕하세요</div>
            <div class="logo-container">
                <img src="images/logo.png" alt="Gogi House Logo" class="splash-logo">
                <div class="korean-text-small">입니다</div>
            </div>
        </div>
        <div class="splash-decor"></div>
    </div>
    
    <!-- Main Content -->
    <div class="container main-content">
        <header class="page-header py-4">
            <img src="images/logo.png" alt="Logo" class="header-logo">
            <h1 class="page-title">MENU</h1>
        </header>
        
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p class="mt-3 text-muted">Đang tải danh sách menu...</p>
        </div>
        
        <div id="error-message" class="alert alert-danger d-none" role="alert">
            Không thể tải danh sách menu. Vui lòng thử lại.
        </div>
        
        <div id="menu-list" class="menu-list d-none">
            <!-- Menu cards will be rendered here by JavaScript -->
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
