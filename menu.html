<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Menu</title>
    <meta name="description" content="Xem chi tiết menu nhà hàng">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="menu-header sticky-top">
            <button id="back-button" class="back-button">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h1 id="menu-title" class="menu-title-header"></h1>
        </header>
        
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p class="mt-3 text-muted">Đang tải menu...</p>
        </div>
        
        <div id="error-message" class="alert alert-danger d-none" role="alert">
            <div id="error-text"></div>
            <button id="error-back-button" class="btn btn-outline-danger mt-3">Quay lại</button>
        </div>
        
        <div id="menu-pages" class="menu-pages d-none">
            <!-- Menu pages will be rendered here by JavaScript -->
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/menu-viewer.js"></script>
</body>
</html>
